name: Build and Release Cross-Platform Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp pyinstaller

      - name: Build Windows Executable
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "DownloadManagerFS" --add-data "assets;assets" server.py
        shell: cmd

      - name: Rename & Stage Artifact
        run: |
          mkdir staging
          copy dist\DownloadManagerFS.exe staging\DownloadManagerFS-Windows.exe
        shell: cmd

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DownloadManagerFS-Windows
          path: staging/DownloadManagerFS-Windows.exe

  build-linux:
    name: Build Linux Executable
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp pyinstaller

      - name: Build Linux Binary
        run: |
          pyinstaller --noconfirm --clean --onefile --name "DownloadManagerFS-Linux" --add-data "assets:assets" server.py
          mkdir staging
          cp dist/DownloadManagerFS-Linux staging/DownloadManagerFS-Linux
          chmod +x staging/DownloadManagerFS-Linux

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DownloadManagerFS-Linux
          path: staging/DownloadManagerFS-Linux

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DownloadManagerFS-Android-APK
          path: app/build/outputs/apk/release/*.apk

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Organize release files
        run: |
          mkdir -p final-release
          cp release-artifacts/DownloadManagerFS-Windows/DownloadManagerFS-Windows.exe final-release/DownloadManagerFS-Windows.exe || true
          cp release-artifacts/DownloadManagerFS-Linux/DownloadManagerFS-Linux final-release/DownloadManagerFS-Linux || true
          cp release-artifacts/DownloadManagerFS-Android-APK/*.apk final-release/DownloadManagerFS-Android.apk || true
          ls -la final-release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: final-release/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
